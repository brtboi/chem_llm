# Benchmark cases for chem-llm-bench (see chem_llm/bench.py).
#
# expect:
#   gap_eV: [lo, hi]   band gap the run must land in. These are PBE/PBEsol-level
#                      values on the Materials Project structure (DFT underestimates
#                      experiment; that is expected). Ranges allow for the
#                      pseudopotential and functional, not for wrong physics.
#   metal: true        must use smearing and report a Fermi energy
#   soc: required | forbidden | optional (default)
#   magnetic: [lo, hi] |magnetization| per atom, Bohr magnetons
#
# work_dir: where the case runs (default bench/work/<case>). The test34
# compounds keep their sandbox/test34 folders.

suites:
  core:
    description: >-
      The compounds developed against: rutile TiO2 (the reference benchmark) and the
      test34 sweep (polar wurtzite, III-V with a small gap, a semimetal, a heavy-element
      perovskite, a layered dichalcogenide).
    cases: [tio2, zno, gaas, graphite, cspbbr3, mos2]
  extended:
    description: >-
      Compounds the prompt was never tuned on: elemental and ionic insulators, an
      indirect-gap semiconductor, a nitride with semicore d states, a perovskite oxide,
      a d-band metal and a ferromagnet.
    cases: [si, diamond, gan, nacl, mgo, srtio3, cu, fe]
  all:
    description: core + extended.
    cases: [tio2, zno, gaas, graphite, cspbbr3, mos2, si, diamond, gan, nacl, mgo, srtio3, cu, fe]

cases:
  tio2:
    compound: TiO2
    spacegroup: P4_2/mnm
    spacegroup_number: 136
    name: rutile
    purpose: reference benchmark; direct gap at Gamma, checked at every high-symmetry point
    expect: {gap_eV: [1.70, 2.00], soc: forbidden}
  zno:
    compound: ZnO
    spacegroup: P6_3mc
    spacegroup_number: 186
    name: wurtzite
    purpose: polar hexagonal cell, no inversion centre; Zn 3d semicore
    work_dir: sandbox/test34/zno
    expect: {gap_eV: [0.40, 1.10]}
  gaas:
    compound: GaAs
    spacegroup: F-43m
    spacegroup_number: 216
    name: zincblende
    purpose: III-V with a small direct gap (PBE nearly closes it)
    work_dir: sandbox/test34/gaas
    expect: {gap_eV: [0.02, 0.60]}
  graphite:
    compound: C
    spacegroup: P6_3/mmc
    spacegroup_number: 194
    name: graphite
    purpose: semimetal, needs smearing; layered hexagonal
    work_dir: sandbox/test34/graphite
    expect: {metal: true}
  cspbbr3:
    compound: CsPbBr3
    spacegroup: Pm-3m
    spacegroup_number: 221
    name: cubic perovskite
    purpose: heavy elements, spin-orbit required (it shrinks the gap by ~1 eV)
    work_dir: sandbox/test34/cspbbr3
    expect: {gap_eV: [0.20, 0.90], soc: required}
  mos2:
    compound: MoS2
    spacegroup: P6_3/mmc
    spacegroup_number: 194
    name: 2H
    purpose: layered dichalcogenide with an indirect gap
    work_dir: sandbox/test34/mos2
    expect: {gap_eV: [0.75, 1.50]}
  si:
    compound: Si
    spacegroup: Fd-3m
    spacegroup_number: 227
    name: diamond-structure silicon
    purpose: textbook indirect gap (CBM near X, not at a labelled point)
    expect: {gap_eV: [0.40, 0.80], soc: forbidden}
  diamond:
    compound: C
    spacegroup: Fd-3m
    spacegroup_number: 227
    name: diamond
    purpose: wide indirect gap; degenerate valence pairs at X
    expect: {gap_eV: [3.80, 4.50], soc: forbidden}
  gan:
    compound: GaN
    spacegroup: P6_3mc
    spacegroup_number: 186
    name: wurtzite
    purpose: nitride with Ga 3d semicore states; direct gap at Gamma
    expect: {gap_eV: [1.40, 2.40]}
  nacl:
    compound: NaCl
    spacegroup: Fm-3m
    spacegroup_number: 225
    name: rock salt
    purpose: ionic wide-gap insulator, alkali semicore
    expect: {gap_eV: [4.40, 5.60], soc: forbidden}
  mgo:
    compound: MgO
    spacegroup: Fm-3m
    spacegroup_number: 225
    name: periclase
    purpose: ionic oxide, direct gap at Gamma
    expect: {gap_eV: [4.00, 5.30], soc: forbidden}
  srtio3:
    compound: SrTiO3
    spacegroup: Pm-3m
    spacegroup_number: 221
    name: cubic perovskite
    purpose: perovskite oxide, indirect R-Gamma gap from Ti 3d conduction bands
    expect: {gap_eV: [1.40, 2.30], soc: forbidden}
  cu:
    compound: Cu
    spacegroup: Fm-3m
    spacegroup_number: 225
    name: fcc copper
    purpose: d-band metal, needs smearing
    expect: {metal: true, soc: forbidden}
  fe:
    compound: Fe
    spacegroup: Im-3m
    spacegroup_number: 229
    name: bcc iron
    purpose: ferromagnetic metal; must be spin-polarized (~2.2 muB/atom)
    expect: {metal: true, magnetic: [1.9, 2.7]}
