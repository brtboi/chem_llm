[project]
name = "chem-llm"
version = "0.1.0"
description = "An LLM agent that runs end-to-end DFT band-structure studies with Quantum ESPRESSO"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brent Hu" }]
keywords = ["dft", "quantum-espresso", "materials-science", "llm-agent", "band-structure", "ase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.26",            # device_map="auto" when loading the local model
    "ase>=3.23",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",             # the plotting scripts the agent writes
    "mp-api>=0.41",
    "numpy>=1.26",
    "pseudohub>=0.1.1",
    "pymatgen>=2024.5.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.1",               # first release with Python 3.12 wheels
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "seekpath>=2.1",               # k-paths, in the scripts the agent writes
    "sentence-transformers>=4.0",  # CrossEncoder(cache_folder=...)
    "spglib>=2.5",                 # the agent's scripts use the 2.5+ dataset API (.number)
    "torch>=2.2",
    "transformers>=4.56",          # from_pretrained(dtype=...)
]

[project.optional-dependencies]
# The Claude API backend (DFTAgent(backend="claude")). Bills per step.
claude = ["anthropic>=1.8.0"]
# Running main.ipynb.
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0", "ipywidgets>=8.0", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/brtboi/chem_llm"
Repository = "https://github.com/brtboi/chem_llm"
Issues = "https://github.com/brtboi/chem_llm/issues"

[project.scripts]
chem-llm = "chem_llm.main:main"
chem-llm-replay = "chem_llm.replay:main"
chem-llm-replay-copy = "chem_llm.replay:copy_main"

[dependency-groups]
# The development environment `uv sync` builds for this checkout: both extras
# plus the Jupyter pieces its notebooks and kernel use. Not part of the
# published package's requirements.
dev = [
    "anthropic>=1.8.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-client>=8.9.1",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.6.2",
    "nbconvert>=7.17.1",
    "notebook>=7.6.1",
    "pandas>=2.0",
    "pyzmq>=27.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license / license-files metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chem_llm"]
# DeePseudopot is a vendored git checkout (github.com/TommyLinkl/DeePseudopot,
# its own license), not part of the distribution.
exclude = ["chem_llm/DeePseudopot", "**/.ipynb_checkpoints", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
# Only what builds the package -- not sandbox runs, logs, notebooks or the
# vendored DeePseudopot checkout.
include = ["/chem_llm", "/README.md", "/LICENSE", "/pyproject.toml", "/config.example.yaml"]
exclude = ["chem_llm/DeePseudopot", "**/.ipynb_checkpoints", "**/__pycache__"]
