# chem_llm configuration.
#
# Copy to config.yaml and fill in, then:
#
#     from chem_llm import DFTAgent, Settings
#     agent = DFTAgent(Settings.from_yaml("config.yaml"))
#
# DFTAgent() with no settings searches the current directory and its parents
# for chem_llm.yaml or config.yaml. Every field is optional: anything omitted
# falls back to the matching environment variable (a .env file works), then
# to a default.

api_keys:
  # Needed for the Claude backend (model.backend: claude).
  # Falls back to $ANTHROPIC_API_KEY.
  anthropic: null
  # Needed by the generate_cif tool. Falls back to $MP_API_KEY.
  # Get one at https://next-gen.materialsproject.org/api
  materials_project: null
  # Needed only for the local Qwen backend. Falls back to $HF_TOKEN.
  huggingface: null

paths:
  # Relative paths are relative to this file, not to the working directory.
  # Each run is written to work_root/<run name>/.
  work_root: ./chem_llm_runs
  # Where the local model is downloaded/cached (sets HF_HOME). Point this
  # at scratch on a cluster -- model weights are tens of GB.
  hf_home: null
  # Documentation retrieval index, built by DocumentationIndex.build()
  # or scripts/build_doc_index.py.
  # Without it the search_docs tool reports that it is unavailable.
  doc_index_dir: ./retrieval_index
  # Permanent record of every run: progress, summary, what changed since the
  # previous run of the same compound, metrics (never deleted; default
  # work_root/_archive). See chem_llm/archive.py.
  archive_dir: null

quantum_espresso:
  # Either give absolute paths to the binaries...
  pw_x: pw.x
  bands_x: bands.x
  # ...or name an Lmod module to load first, leaving the names above bare.
  # The load runs in the same shell invocation as the binary, which an
  # Lmod module requires.
  module: null            # e.g. espresso/7.5-libxc-7.0.0-gpu-cu13
  # Prepended verbatim to each QE call; empty means run serially.
  # GPU nodes: one MPI rank per GPU, e.g. on Perlmutter
  #   "srun -n 4 -c 32 --gpus-per-task=1 --gpu-bind=closest"
  # (-c is needed when the job was allocated as one task owning all CPUs).
  mpi_prefix: ""
  # Extra pw.x flags, e.g. "-nk 4": one k-point pool per MPI rank / GPU.
  pw_args: ""
  # A serial pw.x otherwise spawns one OpenMP thread per core, which for a
  # small cell is heavy oversubscription and much slower.
  omp_num_threads: 1
  # QE jobs at once on a node when several agents share it (parallel
  # benchmark). Each uses every GPU: 1 on 40 GB A100s next to vLLM, 2-3 on 80 GB.
  max_concurrent: 1
  # Or dedicate GPUs to QE, one job per GPU (e.g. [2, 3] while vLLM serves on
  # GPUs 0-1): faster than sharing, since jobs on a shared GPU time-slice it.
  gpu_ids: null
  timeout_seconds: 7200

model:
  # qwen loads the local model into this process; vllm talks to the same
  # model served by vLLM (start it with scripts/serve_vllm.sh) and is several
  # times faster per step. Both run on your own GPUs and cost nothing per
  # run; claude goes to the Anthropic API and bills for every step.
  backend: qwen           # qwen | vllm | claude

  # Local model (qwen and vllm backends; needs a GPU).
  qwen_model: Qwen/Qwen3.8-27B
  max_new_tokens: 5000
  temperature: 0.3        # only used when do_sample is true
  do_sample: true         # false = greedy, reproducible run to run
  vllm_url: http://localhost:8000/v1   # vllm backend: the server's endpoint

  # Claude API backend (used only when backend: claude).
  claude_model: claude-opus-4-8
  claude_max_tokens: 16000
  claude_effort: high     # low | medium | high | xhigh | max

agent:
  # Tool calls per run before the loop gives up. A from-scratch band
  # structure takes roughly 40 (Claude) to 60+ (Qwen) steps.
  max_steps: 80
  # Tool results kept in the prompt; older ones are summarised out.
  max_history: 32
  # Trim dead material from that history: notes (already in the Notes
  # section), superseded file versions/reads, and the failed attempts and doc
  # searches of a fix that has since run OK. Adds a Progress ledger. Only the
  # prompt changes; the full history is still logged.
  trim_history: true
  # Hard cap on characters returned by one read_file call.
  read_max_chars: 10000
